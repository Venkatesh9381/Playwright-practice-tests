name: Pulse Dashboard Tests

on:
  push:
    branches:
      - main
      - feat/pulse-dashboard-refresh
  pull_request:
    branches: [main, feature/per-pipeline-reports]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-tests:
    name: Dashboard UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run dashboard tests
        run: npx playwright test --config=playwright.dashboard.config.js
      - name: Upload HTML report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-dashboard-playwright-report
          path: |
            playwright-report/dashboard/
            test-results/dashboard/
          if-no-files-found: ignore
          retention-days: 14
