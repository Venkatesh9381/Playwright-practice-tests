name: Playwright Tests

concurrency:
  group: pulse-pages-deployment
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - prod
      script:
        description: 'Spec file or folder to run (example: day-1.spec.js)'
        required: true
        default: 'day-1.spec.js'
        type: string
      browser:
        description: 'Browser project to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'qa' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        SCRIPT: ${{ inputs.script || '' }}
        BROWSER: ${{ inputs.browser || 'all' }}
        TEST_BASE_URL: ${{ vars.TEST_BASE_URL }}
      shell: bash
      run: |
        args=(--grep-invert 'Pulse dashboard')
        if [[ -n "$SCRIPT" ]]; then
          args+=("$SCRIPT")
        fi
        if [[ "$BROWSER" != "all" ]]; then
          args+=(--project="$BROWSER")
        fi
        npx playwright test "${args[@]}"
    - name: Upload Playwright report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 14
    - name: Restore report archive
      if: always() && github.event_name != 'pull_request'
      uses: actions/checkout@v4
      with:
        ref: pulse-reports
        path: report-archive
        fetch-depth: 0

    - name: Prepare site
      if: always() && github.event_name != 'pull_request'
      env:
        REPORT_RUN_ID: ${{ github.run_id }}
      run: |
        mkdir -p site/reports/${REPORT_RUN_ID}
        if [[ -d report-archive/reports ]]; then
          cp -r report-archive/reports/. site/reports/
        fi
        cp -r playwright-report/. site/reports/${REPORT_RUN_ID}/ 2>/dev/null || true
        if [[ ! -f site/reports/${REPORT_RUN_ID}/index.html ]]; then
          cat > site/reports/${REPORT_RUN_ID}/index.html <<'HTML'
        <!doctype html><html lang="en"><meta charset="utf-8"><title>Playwright report unavailable</title>
        <body style="font:16px system-ui;max-width:720px;margin:10vh auto;padding:24px">
        <h1>Playwright report unavailable</h1>
        <p>This workflow did not produce an HTML report. Check the workflow run and downloadable artifacts for details.</p>
        </body></html>
        HTML
        fi
        cp docs/dashboard.html site/dashboard.html
        cat > site/report-status.txt <<EOF
        Workflow run: ${REPORT_RUN_ID}
        Commit: ${GITHUB_SHA}
        Conclusion: ${{ job.status }}
        EOF
    - name: Save report in run archive
      if: always() && github.event_name != 'pull_request'
      env:
        REPORT_RUN_ID: ${{ github.run_id }}
      run: |
        mkdir -p report-archive/reports/${REPORT_RUN_ID}
        cp -r site/reports/${REPORT_RUN_ID}/. report-archive/reports/${REPORT_RUN_ID}/
        git -C report-archive config user.name "github-actions[bot]"
        git -C report-archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C report-archive add reports/${REPORT_RUN_ID}
        if ! git -C report-archive diff --cached --quiet; then
          git -C report-archive commit -m "Archive Playwright report ${REPORT_RUN_ID}"
          git -C report-archive push origin pulse-reports
        fi

    - name: Upload to GitHub Pages
      if: always() && github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    if: always() && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
