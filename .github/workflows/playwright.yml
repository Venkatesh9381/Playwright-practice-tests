name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - prod
      script:
        description: 'Script name (example: day-1.spec.js)'
        required: true
        default: 'day-1.spec.js'
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --grep-invert "Dashboard" ${{ inputs.script || '' }}
    - name: Prepare site
      if: always()
      run: |
        mkdir -p site
        cp -r playwright-report/* site/ || true
        cp docs/dashboard.html site/dashboard.html || true
    - name: Upload to GitHub Pages
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
